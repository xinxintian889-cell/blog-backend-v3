version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_MASTER_URL=mysql+pymysql://root:123456@db:3306/blog
      - DB_SLAVE_URL=mysql+pymysql://root:123456@db:3306/blog
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=my-super-secret-key-123
    depends_on:
      - db
      - redis
  
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: blog
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"